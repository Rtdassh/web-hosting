version: '3.8'

# Orquestación Unificada para Producción (Hito 100% - Twelve-Factor App)
# Sistema: CloudPaaS - Web Hosting as a Service

services:
  paas_db:
    image: postgres:16-alpine
    container_name: paas_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-paas_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-paas_db}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - paas_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  paas_backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: paas_backend_prod
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    environment:
      - ENVIRONMENT=production
      - PROJECT_NAME=CloudPaaS Web Hosting
      - POSTGRES_SERVER=paas_db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-paas_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-paas_db}
      - SECRET_KEY=${SECRET_KEY:?Configure SECRET_KEY}
      - DOCKER_SOCKET_PATH=/var/run/docker.sock
      - HOSTING_STORAGE_PATH=/srv/hosting/instancias
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
      - BREVO_API_KEY=${BREVO_API_KEY:-}
      - BREVO_SENDER_EMAIL=${BREVO_SENDER_EMAIL:-}
      - BREVO_SENDER_NAME=${BREVO_SENDER_NAME:-Codrop}
      - PASSWORD_RESET_SMTP_HOST=${PASSWORD_RESET_SMTP_HOST:-}
      - PASSWORD_RESET_SMTP_PORT=${PASSWORD_RESET_SMTP_PORT:-1025}
      - PASSWORD_RESET_SMTP_SECURITY=${PASSWORD_RESET_SMTP_SECURITY:-none}
      - PASSWORD_RESET_FROM_EMAIL=${PASSWORD_RESET_FROM_EMAIL:-}
      - PASSWORD_RESET_SMTP_USERNAME=${PASSWORD_RESET_SMTP_USERNAME:-}
      - PASSWORD_RESET_SMTP_PASSWORD=${PASSWORD_RESET_SMTP_PASSWORD:-}
      - PASSWORD_RESET_FRONTEND_URL=${PASSWORD_RESET_FRONTEND_URL:-http://localhost/}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /srv/hosting:/srv/hosting
    depends_on:
      paas_db:
        condition: service_healthy
    networks:
      - paas_internal
      - paas_instances_network

  paas_frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: paas_frontend_prod
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - paas_backend
    networks:
      - paas_internal

volumes:
  postgres_prod_data:
    name: paas_postgres_prod_data

networks:
  paas_internal:
    name: paas_internal
    driver: bridge
  paas_instances_network:
    name: paas_instances_network
    driver: bridge
