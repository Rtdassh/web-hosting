# Isolated opt-in environment; no production .env, volumes or networks are reused.
services:
  postgres-migrations:
    image: postgres:${CODROP_TEST_POSTGRES_VERSION:-16}-alpine
    environment:
      POSTGRES_USER: codrop_migration_test
      POSTGRES_PASSWORD: ${CODROP_TEST_POSTGRES_PASSWORD:?Set a dedicated local test password}
      POSTGRES_DB: codrop_migration_new
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - migrations_test_data:/var/lib/postgresql/data
      - ./backend/tests/migrations/init-test.sql:/docker-entrypoint-initdb.d/01-test.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U codrop_migration_test -d codrop_migration_new"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  migrations_test_data:
