# Configuración optimizada y segura de Nginx para instancias estáticas de clientes (PaaS)
server {
    listen       80;
    server_name  localhost;

    # Directorio de montaje de sólo lectura del usuario
    root   /usr/share/nginx/html;
    index  index.html index.htm;

    # Opciones de seguridad básicas
    server_tokens off;
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    # Manejo de rutas estáticas y Single Page Applications
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Caché para activos estáticos comunes
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2)$ {
        expires 1d;
        add_header Cache-Control "public, no-transform";
    }

    # Página de error
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
