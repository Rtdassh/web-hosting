# Configuración optimizada y segura de Nginx para instancias estáticas de clientes (PaaS)
server {
    listen       80;
    server_name  localhost *.localhost;

    # Directorio de montaje de sólo lectura del usuario
    root   /usr/share/nginx/html;
    index  index.html index.htm;

    # Opciones de seguridad básicas
    server_tokens off;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compresión Gzip para optimizar transferencia
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml;

    # Manejo de rutas estáticas y soporte nativo para Single Page Applications (SPAs)
    # Permite recargar en /dashboard, /contacto o cualquier ruta de React/Vue sin 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Caché para activos estáticos comunes con 404 si falta el archivo
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|map|webp)$ {
        expires 1d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # Página de error
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
