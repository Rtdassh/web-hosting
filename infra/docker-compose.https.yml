# Optional Linux host proxy; prepare Caddyfile and DNS first.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
volumes:
  caddy_data:
  caddy_config:
