<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sitio de Prueba - CloudPaaS</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid #334155;
      backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 2.5rem;
      max-width: 500px;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .badge {
      display: inline-block;
      background: #10b981;
      color: #022c22;
      font-weight: 700;
      font-size: 0.75rem;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      margin-bottom: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    h1 {
      font-size: 1.875rem;
      margin-top: 0;
      margin-bottom: 0.75rem;
    }
    p {
      color: #94a3b8;
      font-size: 1rem;
      line-height: 1.5;
    }
    .footer {
      margin-top: 2rem;
      font-size: 0.875rem;
      color: #64748b;
      border-top: 1px solid #334155;
      padding-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">Despliegue Exitoso</span>
    <h1>¡Servidor Web en Línea!</h1>
    <p>Esta página fue empaquetada en un archivo <code>.zip</code>, transferida al backend y servida de forma aislada dentro de un contenedor <strong>nginx:alpine</strong> administrado por CloudPaaS.</p>
    <div class="footer">
      CloudPaaS • Modern Web Hosting Platform
    </div>
  </div>
</body>
</html>
